<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title description">
  <title id="title">Brand board Школы Терапии</title>
  <desc id="description">Название, слоган, учебный эскиз логотипа, цветовая палитра, типографика и примеры применения фирменного стиля.</desc>
  <rect width="1600" height="1600" fill="#F0E5DE"/>

  <rect x="56" y="56" width="1488" height="470" rx="28" fill="#2B1E24"/>
