    <text x="30" y="122" fill="#D8B6A6" font-family="DM Mono, Consolas, monospace" font-size="16" letter-spacing="3">01 — ТЕМА</text>
    <text x="30" y="192" fill="#F0E5DE" font-family="Prata, Georgia, serif" font-size="35">От симптома</text>
    <text x="30" y="238" fill="#F0E5DE" font-family="Prata, Georgia, serif" font-size="35">к решению</text>
    <text x="30" y="298" fill="#A8B5A2" font-family="Manrope, Arial, sans-serif" font-size="20">Разбираем ход мысли</text>
    <text x="30" y="330" fill="#A8B5A2" font-family="Manrope, Arial, sans-serif" font-size="20">шаг за шагом</text>
