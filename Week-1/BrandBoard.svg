    <text x="0" y="236" fill="#4B3440" font-family="Manrope, Arial, sans-serif" font-size="26">Понятная система подготовки.</text>
    <text x="0" y="278" fill="#4B3440" font-family="Manrope, Arial, sans-serif" font-size="26">Практика клинического мышления.</text>
    <text x="0" y="320" fill="#4B3440" font-family="Manrope, Arial, sans-serif" font-size="26">Поддержка без стыда за незнание.</text>
