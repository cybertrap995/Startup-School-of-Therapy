    <text x="30" y="422" fill="#D8B6A6" font-family="Manrope, Arial, sans-serif" font-size="19">ЗНАНИЯ · ПОДДЕРЖКА · РОСТ</text>

    <rect x="400" y="72" width="360" height="460" rx="28" fill="#FFFFFF" stroke="#D8B6A6" stroke-width="2"/>
    <circle cx="580" cy="172" r="72" fill="none" stroke="#2B1E24" stroke-width="3"/>
    <path d="M540 138 L540 206 C588 206 605 190 605 172 C605 154 588 138 540 138 Z" fill="none" stroke="#2B1E24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M570 150 H622 M596 150 V200" fill="none" stroke="#D8B6A6" stroke-width="8" stroke-linecap="round"/>
    <text x="580" y="290" text-anchor="middle" fill="#2B1E24" font-family="Prata, Georgia, serif" font-size="34">Школа Терапии</text>
    <text x="580" y="333" text-anchor="middle" fill="#4B3440" font-family="Manrope, Arial, sans-serif" font-size="19">от Dr.Tamuna</text>
    <text x="580" y="394" text-anchor="middle" fill="#4B3440" font-family="Manrope, Arial, sans-serif" font-size="20">Думать как врач.</text>
    <text x="580" y="426" text-anchor="middle" fill="#4B3440" font-family="Manrope, Arial, sans-serif" font-size="20">Учиться без страха.</text>
