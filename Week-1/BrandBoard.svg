    <text x="0" y="130" fill="#F0E5DE" font-family="Prata, Georgia, serif" font-size="76">Школа Терапии</text>
    <text x="2" y="178" fill="#A8B5A2" font-family="Manrope, Arial, sans-serif" font-size="28">от Dr.Tamuna</text>
